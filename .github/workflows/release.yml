name: Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Optional version to publish; must match pyproject.toml"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Validate and publish
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv and Python
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"

      - name: Install project and development dependencies
        run: uv sync --all-groups

      - name: Validate release version
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          PROJECT_VERSION="$(uv run python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"

          if [[ ! "$PROJECT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected pyproject.toml to declare a stable MAJOR.MINOR.PATCH version; got: $PROJECT_VERSION" >&2
            exit 1
          fi

          if [[ "$REF_TYPE" == "tag" && "$REF_NAME" != "v$PROJECT_VERSION" ]]; then
            echo "Tag $REF_NAME does not match project version v$PROJECT_VERSION." >&2
            exit 1
          fi

          if [[ -n "$INPUT_VERSION" && "$INPUT_VERSION" != "$PROJECT_VERSION" ]]; then
            echo "Requested version $INPUT_VERSION does not match pyproject.toml version $PROJECT_VERSION." >&2
            exit 1
          fi

          echo "version=$PROJECT_VERSION" >> "$GITHUB_OUTPUT"

      - name: Lint
        run: uv run ruff check .

      - name: Type-check
        run: uv run mypy

      - name: Test
        run: uv run pytest

      - name: Build Docker image
        run: docker build --tag evidence-grounded-decision-support .

      - name: Publish release if this version is new
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          REF_TYPE: ${{ github.ref_type }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          TAG="v$RELEASE_VERSION"

          if gh release view "$TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            echo "Release $TAG already exists; leaving it unchanged."
            exit 0
          fi

          if [[ "$REF_TYPE" == "tag" ]]; then
            gh release create "$TAG" \
              --verify-tag \
              --repo "$GH_REPO" \
              --title "Evidence-Grounded Decision Support $TAG" \
              --generate-notes
          else
            gh release create "$TAG" \
              --target "$COMMIT_SHA" \
              --repo "$GH_REPO" \
              --title "Evidence-Grounded Decision Support $TAG" \
              --generate-notes
          fi
